name: CI - Kind + Playwright

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Build JAR ----
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build jar (skip tests)
        run: mvn -q -DskipTests clean package

      # ---- Build Docker image ----
      - name: Build docker image
        run: docker build -t fake-user-app:ci .

      # ---- Create kind cluster ----
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Load image into kind
        run: kind load docker-image fake-user-app:ci --name ci

      # ---- Deploy to Kubernetes ----
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/fake-user-app.yaml

          # Ensure the Deployment uses the image we built and loaded into kind
          kubectl -n fake-user-app set image deployment/fake-user-app app=fake-user-app:ci

          # Ingress is optional for CI; don't fail if it can't apply
          kubectl apply -f k8s/ingress.yaml || true

      - name: Wait for rollout
        run: |
          set -e

          # Wait for Postgres StatefulSet to complete rollout
          kubectl -n fake-user-app rollout status statefulset/my-postgres-db-2 --timeout=240s

          if ! kubectl -n fake-user-app rollout status deployment/fake-user-app --timeout=300s; then
            echo "---- pods ----"
            kubectl -n fake-user-app get pods -o wide || true

            echo "---- describe app pods ----"
            kubectl -n fake-user-app describe pods -l app=fake-user-app || true

            echo "---- recent events ----"
            kubectl -n fake-user-app get events --sort-by=.lastTimestamp | tail -n 200 || true

            echo "---- app logs ----"
            kubectl -n fake-user-app logs -l app=fake-user-app --tail=400 || true

            exit 1
          fi

      - name: Collect k8s diagnostics
        if: always()
        run: |
          mkdir -p k8s-diag
          kubectl -n fake-user-app get all -o wide > k8s-diag/get-all.txt || true
          kubectl -n fake-user-app get pods -o wide > k8s-diag/pods.txt || true
          kubectl -n fake-user-app get events --sort-by=.lastTimestamp > k8s-diag/events.txt || true
          kubectl -n fake-user-app describe deployment/fake-user-app > k8s-diag/describe-deploy.txt || true
          kubectl -n fake-user-app logs -l app=fake-user-app --all-containers --tail=1000 > k8s-diag/app-logs.txt || true
          kubectl -n fake-user-app logs -l app=my-postgres-db-2 --all-containers --tail=1000 > k8s-diag/db-logs.txt || true

      - name: Upload k8s diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k8s-diagnostics
          path: k8s-diag/
          retention-days: 7

      # ---- Smoke check + Playwright ----
      - name: Port-forward service
        run: |
          set -e
          # Forward cluster service to localhost for CI tests
          kubectl -n fake-user-app port-forward svc/fake-user-app 18080:8080 > /tmp/port-forward.log 2>&1 &
          echo $! > /tmp/pf.pid

      - name: Wait for app to be reachable
        run: |
          set -e
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18080/actuator/health >/dev/null 2>&1; then
              echo "App is reachable"
              exit 0
            fi
            sleep 2
          done
          echo "Timed out waiting for app"
          echo "---- port-forward log ----"
          tail -n 200 /tmp/port-forward.log || true
          exit 1

      - name: API smoke test
        run: |
          set -e
          # Try a few likely endpoints; do not fail if only one exists
          curl -fsS http://127.0.0.1:18080/actuator/health || true
          curl -fsS http://127.0.0.1:18080/health || true
          curl -fsS http://127.0.0.1:18080/users/random || true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Playwright dependencies
        run: |
          set -e
          # Only run Playwright if the repo has a package.json
          if [ ! -f package.json ]; then
            echo "No package.json found; skipping Playwright steps."
            exit 0
          fi
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: http://127.0.0.1:18080
        run: |
          set -e
          if [ ! -f package.json ]; then
            echo "No package.json found; skipping Playwright tests."
            exit 0
          fi
          # Prefer npm script if present; otherwise use playwright directly
          if npm run | grep -q " test"; then
            npm test
          else
            npx playwright test
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop port-forward
        if: always()
        run: |
          if [ -f /tmp/pf.pid ]; then
            kill $(cat /tmp/pf.pid) || true
          fi

      # ---- Cleanup ----
      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name ci